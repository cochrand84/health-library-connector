---
services:
  mayo-library:
    image: php:8.3-apache
    container_name: mayo-library
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./html/index.php:/var/www/html/index.php
      - ./html/index-cta.php:/var/www/html/index-cta.php
      - ./html/config.php:/var/www/html/config.php
      - ./html/doctors.php:/var/www/html/doctors.php
      - ./html/cache:/var/www/html/cache

networks: {}
