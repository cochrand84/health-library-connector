---
services:
  mayo-library:
    image: php:8.3-apache
    container_name: mayo-library
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      # Mount the whole directory, not individual files. Single-file bind
      # mounts pin the original inode, so when an editor or scp replaces
      # the file the container keeps serving the old copy until it is
      # recreated (the "needs compose down/up after every edit" problem).
      - ./html:/var/www/html

networks: {}
