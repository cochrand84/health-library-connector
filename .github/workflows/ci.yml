name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.1", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: PHP syntax check
        run: find . -name '*.php' -not -path './prototype/*' -print0 | xargs -0 -n1 php -l
      - name: Demo data is valid JSON
        run: for f in $(find demo-data -name '*.json'); do php -r 'json_decode(file_get_contents($argv[1]), false, 512, JSON_THROW_ON_ERROR);' "$f" || exit 1; done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin zip
        run: |
          mkdir -p build/pulsegrid-content-connector
          git archive HEAD | tar -x -C build/pulsegrid-content-connector
          cd build && zip -r ../pulsegrid-content-connector.zip pulsegrid-content-connector
      - uses: softprops/action-gh-release@v2
        with:
          files: pulsegrid-content-connector.zip
          generate_release_notes: true
